<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central Vault / Container Box Base -->
  <path d="M24 44C24 39.5817 27.5817 36 32 36H96C100.418 36 104 39.5817 104 44V96C104 100.418 100.418 104 96 104H32C27.5817 104 24 100.418 24 96V44Z" fill="#09090b" stroke="url(#vaultGrad)" stroke-width="4" />
  
  <!-- Vault Lid Top Handle -->
  <rect x="46" y="24" width="36" height="12" rx="4" fill="none" stroke="url(#vaultGrad)" stroke-width="3" />

  <!-- Funneling Binary 01 & .exe into Vault -->
  <text x="64" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-weight="900" font-size="22" fill="#60a5fa" text-anchor="middle" filter="url(#glow)">BIN 01</text>
  
  <!-- Downward Collection Arrow -->
  <path d="M64 74V92M64 92L54 82M64 92L74 82" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
